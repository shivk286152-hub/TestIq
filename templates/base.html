<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}{{ site_name }}{% endblock %}</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        :root {
            --sidebar-width: 13rem;
        }

        .sidebar-collapsed {
            --sidebar-width: 4rem;
        }

        .sidebar-text {
            transition: opacity 0.25s ease, transform 0.25s ease;
            white-space: nowrap;
        }

        .sidebar-collapsed .sidebar-text {
            opacity: 0;
            transform: translateX(-10px);
            pointer-events: none;
        }

        /* DESKTOP */
        @media (min-width: 768px) {
            .sidebar {
                width: var(--sidebar-width);
                transform: translateX(0);
            }

            .main {
                margin-left: var(--sidebar-width);
            }

            .overlay {
                display: none;
            }
        }

        /* MOBILE */
        @media (max-width: 767px) {
            .sidebar {
                width: 16rem;
                transform: translateX(-100%);
                position: fixed;
                z-index: 60;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main {
                margin-left: 0 !important;
            }

            .overlay {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.4);
                z-index: 50;
            }

            .overlay.show {
                display: block;
            }
        }
    </style>


</head>

<body class="bg-gray-100 text-gray-800">

    <!-- HEADER -->
    <header class="fixed top-0 left-0 right-0 h-16 bg-white shadow z-50">
        <div class="h-full px-4 flex items-center justify-between">

            <!-- LEFT -->
            <div class="flex items-center gap-3">
                <button id="toggleSidebar" class="text-gray-700 hover:text-blue-600 text-xl">
                    <i class="fa-solid fa-bars"></i>
                </button>

                <span class="text-lg font-bold text-blue-600 whitespace-nowrap">
                    {{ site_name }}
                </span>
            </div>

            <!-- RIGHT -->
            <div class="flex items-center gap-5">

                <!-- SEARCH -->
                <div class="hidden md:flex items-center bg-gray-100 rounded px-3 py-1">
                    <i class="fa-solid fa-magnifying-glass text-gray-500 text-sm"></i>
                    <input type="text" placeholder="Search..." class="bg-transparent outline-none px-2 text-sm w-40">
                </div>

                <!-- USER DROPDOWN -->
                {% if user.is_authenticated %}
                <div class="relative group">

                    <button class="flex items-center gap-2 focus:outline-none">
                        {% if user.profile.profile_pic %}
                        <img src="{{ user.profile.profile_pic.url }}" class="w-9 h-9 rounded-full object-cover border">
                        {% else %}
                        <i class="fa-solid fa-user-circle text-3xl text-gray-600"></i>
                        {% endif %}

                        <span class="hidden sm:block text-sm font-medium text-gray-700">
                            {{ user.username }}
                        </span>
                    </button>

                    <div class="absolute right-0 mt-2 w-44 bg-white rounded shadow-lg
                               opacity-0 invisible group-hover:opacity-100
                               group-hover:visible transition-all duration-200 z-50">

                        <a href="{% url 'profile' %}" class="block px-4 py-2 text-sm hover:bg-gray-100">
                            <i class="fa-solid fa-user mr-2"></i> Profile
                        </a>

                        <a href="{% url 'logout' %}" class="block px-4 py-2 text-sm hover:bg-gray-100 text-red-600">
                            <i class="fa-solid fa-right-from-bracket mr-2"></i> Logout
                        </a>
                    </div>

                </div>
                {% else %}
                <a href="{% url 'login' %}" class="text-blue-600 font-medium">
                    Login
                </a>
                {% endif %}
            </div>

        </div>
    </header>

    <!-- BODY -->
    <div id="layout" class="flex pt-14 transition-[--sidebar-width] duration-300 ease-in-out">

        <!-- SIDEBAR -->
        <aside class="sidebar fixed top-14 left-0 h-[calc(100vh-3.5rem)]
                   bg-gray-700 text-white transition-all duration-300
                   ease-in-out flex flex-col">

            <nav class="flex-1 py-4 space-y-1">

                <a href="#" class="flex items-center px-4 py-3 hover:bg-gray-600">
                    <div class="w-8 text-center">
                        <i class="fa-solid fa-pen"></i>
                    </div>
                    <span class="sidebar-text ml-3">Test</span>
                </a>

                <a href="#" class="flex items-center px-4 py-3 hover:bg-gray-600">
                    <div class="w-8 text-center">
                        <i class="fa-solid fa-newspaper"></i>
                    </div>
                    <span class="sidebar-text ml-3">Current Affairs</span>
                </a>

                <a href="#" class="flex items-center px-4 py-3 hover:bg-gray-600">
                    <div class="w-8 text-center">
                        <i class="fa-solid fa-book"></i>
                    </div>
                    <span class="sidebar-text ml-3">Exam News</span>
                </a>
            </nav>

            <!-- SIDEBAR BOTTOM -->
            <div class="border-t border-gray-600 p-4">
                {% if user.is_authenticated %}
                <a href="{% url 'profile' %}" class="flex items-center hover:text-blue-300">
                    <div class="w-8 text-center">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <span class="sidebar-text ml-3">
                        {{ user.username }}
                    </span>
                </a>
                {% else %}
                <a href="{% url 'login' %}" class="flex items-center text-blue-300">
                    <div class="w-8 text-center">
                        <i class="fa-solid fa-right-to-bracket"></i>
                    </div>
                    <span class="sidebar-text ml-3">Login</span>
                </a>
                {% endif %}
            </div>
        </aside>

        <!-- OVERLAY (for mobile only) -->
        <div id="overlay" class="overlay"></div>

        <!-- MAIN -->
        <main class="main w-full pt-6 pl-1 transition-[margin-left] duration-300 ease-in-out">
            {% block content %}{% endblock %}
        </main>

    </div>

    <!-- JS -->
    <script>
        const layout = document.getElementById("layout");
        const toggleBtn = document.getElementById("toggleSidebar");
        const sidebar = document.querySelector(".sidebar");
        const overlay = document.getElementById("overlay");

        function isMobile() {
            return window.innerWidth < 768;
        }

        // Desktop collapse system
        if (!isMobile() && localStorage.getItem("sidebar") === "collapsed") {
            layout.classList.add("sidebar-collapsed");
        }

        toggleBtn.onclick = () => {

            if (isMobile()) {
                sidebar.classList.toggle("open");
                overlay.classList.toggle("show");
            } else {
                layout.classList.toggle("sidebar-collapsed");

                localStorage.setItem(
                    "sidebar",
                    layout.classList.contains("sidebar-collapsed") ? "collapsed" : "expanded"
                );
            }
        };

        overlay.onclick = () => {
            sidebar.classList.remove("open");
            overlay.classList.remove("show");
        };
    </script>


</body>

</html>
