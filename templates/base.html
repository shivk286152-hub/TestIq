<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{% block title %}My Website{% endblock %}</title>

<style>

/* ===== RESET ===== */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

/* ===== BODY LAYOUT ===== */
body{
    display:flex;
    min-height:100vh;
    background:#f5f6fa;
}

/* ===== SIDEBAR ===== */
.sidebar{
    width:240px;
    background:#111827;
    color:white;
    padding:20px;
    min-height:100vh;
}

.sidebar h2{
    margin-bottom:20px;
}

.sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    margin:12px 0;
}

/* ===== CONTENT ===== */
.content{
    flex:1;
    padding:20px;
    overflow-y:auto;
    padding-bottom:100px; /* space for navbar */
}

/* ===== GLASS NAVBAR ===== */
.mobile-nav{
    position:fixed;
    bottom:15px;
    left:50%;
    transform:translateX(-50%);
    width:95%;
    height:65px;

    display:flex;
    justify-content:space-around;
    align-items:center;

    border-radius:25px;

    background:rgba(255,255,255,0.2);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    border:1px solid rgba(255,255,255,0.3);
    box-shadow:0 8px 25px rgba(0,0,0,0.15);

    transition: all 0.4s ease;
    z-index:9999;
}

/* Hide state */
.mobile-nav.hide{
    transform:translate(-50%,120px);
    opacity:0;
}

/* NAV ITEMS */
.nav-item{
    text-decoration:none;
    color:#111;
    font-size:22px;
    display:flex;
    flex-direction:column;
    align-items:center;
    transition:0.3s;
}

.nav-item span{
    font-size:12px;
}

/* Tap animation */
.nav-item:active{
    transform:scale(1.2);
}

/* ===== RESPONSIVE ===== */

/* Hide navbar on desktop */
@media(min-width:768px){
    .mobile-nav{
        display:none;
    }
}

/* Hide sidebar on mobile */
@media(max-width:768px){
    .sidebar{
        display:none;
    }

    body{
        flex-direction:column;
    }
}

</style>
</head>

<body>

<!-- ===== SIDEBAR ===== -->
<div class="sidebar">
    <h2>Menu</h2>

    <a href="/">Home</a>
    <a href="/mock-tests/">Mock Tests</a>
    <a href="/results/">Results</a>
    <a href="/profile/">Profile</a>
</div>

<!-- ===== CONTENT AREA ===== -->
<div class="content">
    {% block content %}
    <!-- Page content here -->
    {% endblock %}
</div>

<!-- ===== MOBILE GLASS NAVBAR ===== -->
<div class="mobile-nav" id="mobileNav">

    <a href="/" class="nav-item">
        🏠
        <span>Home</span>
    </a>

    <a href="/mock-tests/" class="nav-item">
        📝
        <span>Tests</span>
    </a>

    <a href="/results/" class="nav-item">
        📊
        <span>Results</span>
    </a>

    <a href="/profile/" class="nav-item">
        👤
        <span>Profile</span>
    </a>

</div>

<!-- ===== JS: Hide/Show on Scroll ===== -->
<script>

let navbar = document.getElementById("mobileNav");
let scrollTimer;

window.addEventListener("scroll", () => {

    navbar.classList.add("hide");

    clearTimeout(scrollTimer);

    scrollTimer = setTimeout(()=>{
        navbar.classList.remove("hide");
    }, 250);

});

</script>

</body>
</html>
