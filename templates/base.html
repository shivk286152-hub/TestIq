<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ site_name }}{% endblock %}</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
    --sidebar-width: 13rem;
}

/* Tap highlight remove (mobile feel) */
html {
    -webkit-tap-highlight-color: transparent;
}

/* Collapsed sidebar */
.sidebar-collapsed {
    --sidebar-width: 4rem;
}

.sidebar-text {
    transition: opacity .25s, transform .25s;
    white-space: nowrap;
}

.sidebar-collapsed .sidebar-text {
    opacity: 0;
    transform: translateX(-10px);
    pointer-events: none;
}

/* ================= DESKTOP ================= */
@media (min-width:768px){

    .sidebar{
        width:var(--sidebar-width);
        transform:translateX(0)!important;
        position:relative!important;
        height:calc(100dvh - 4rem);
    }

    .main{
        margin-left:var(--sidebar-width);
        min-height:calc(100dvh - 4rem);
    }

    .overlay{display:none!important;}
}

/* ================= MOBILE ================= */
@media (max-width:767px){

    .sidebar{
        width:11rem;
        transform:translateX(-100%);
        position:fixed;
        z-index:60;
        height:calc(100dvh - 4rem);
        top:4rem;
        left:0;
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .main{
        margin:0!important;
        width:100%;
        padding:1rem;
        min-height:calc(100dvh - 4rem);
    }

    .overlay{
        display:none;
        position:fixed;
        inset:0;
        background:rgba(0,0,0,.4);
        z-index:50;
        top:4rem;
    }

    .overlay.show{display:block;}
}

html,body{
    height:100%;
    margin:0;
}
</style>
</head>

<body class="bg-gray-100 text-gray-800">

<!-- ================= HEADER ================= -->
<header class="fixed top-0 left-0 right-0 h-16 bg-white shadow z-50">
<div class="h-full px-4 flex items-center justify-between">

<!-- LEFT -->
<div class="flex items-center gap-3">
<button id="toggleSidebar" class="text-xl md:hidden">
<i class="fa-solid fa-bars"></i>
</button>

<button id="toggleSidebarDesktop" class="text-xl hidden md:block">
<i class="fa-solid fa-bars"></i>
</button>

<span class="text-lg font-bold text-blue-600">
{{ site_name }}
</span>
</div>

<!-- RIGHT -->
<div class="flex items-center gap-4">

<div class="hidden md:flex items-center bg-gray-100 rounded px-3 py-1">
<i class="fa fa-search text-sm"></i>
<input type="text" placeholder="Search..."
       class="bg-transparent outline-none px-2 text-sm w-40">
</div>

{% if user.is_authenticated %}
<div class="relative group">

<button class="flex items-center gap-2">
{% if user.profile.profile_pic %}
<img src="{{ user.profile.profile_pic.url }}"
     class="w-9 h-9 rounded-full object-cover border">
{% else %}
<i class="fa fa-user-circle text-3xl"></i>
{% endif %}
<span class="hidden sm:block text-sm">{{ user.username }}</span>
</button>

<div class="absolute right-0 mt-2 w-44 bg-white rounded shadow-lg
opacity-0 invisible group-hover:opacity-100
group-hover:visible transition">

<a href="{% url 'profile' %}"
class="block px-4 py-2 hover:bg-gray-100">
Profile
</a>

<a href="{% url 'logout' %}"
class="block px-4 py-2 text-red-600 hover:bg-gray-100">
Logout
</a>

</div>
</div>
{% else %}
<a href="{% url 'login' %}" class="text-blue-600">Login</a>
{% endif %}

</div>
</div>
</header>

<!-- ================= LAYOUT ================= -->
<div id="layout" class="flex pt-16">

<!-- SIDEBAR -->
<aside class="sidebar bg-gray-700 text-white
transition-all duration-300 flex flex-col">

<nav class="flex-1 py-4 space-y-1">

<a href="#" class="flex items-center px-4 py-3 hover:bg-gray-600">
<i class="fa fa-pen w-6"></i>
<span class="sidebar-text ml-3">Test</span>
</a>

<a href="#" class="flex items-center px-4 py-3 hover:bg-gray-600">
<i class="fa fa-newspaper w-6"></i>
<span class="sidebar-text ml-3">Current Affairs</span>
</a>

<a href="#" class="flex items-center px-4 py-3 hover:bg-gray-600">
<i class="fa fa-book w-6"></i>
<span class="sidebar-text ml-3">Exam News</span>
</a>

</nav>

<div class="border-t border-gray-600 p-4">

{% if user.is_authenticated %}
<a href="{% url 'profile' %}" class="flex items-center">
<i class="fa fa-user w-6"></i>
<span class="sidebar-text ml-3">{{ user.username }}</span>
</a>
{% else %}
<a href="{% url 'login' %}" class="flex items-center text-blue-300">
<i class="fa fa-sign-in w-6"></i>
<span class="sidebar-text ml-3">Login</span>
</a>
{% endif %}

</div>
</aside>

<!-- OVERLAY -->
<div id="overlay" class="overlay"></div>

<!-- MAIN -->
<main class="main flex-1 overflow-y-auto">
{% block content %}{% endblock %}
</main>

</div>

<!-- ================= JS ================= -->
<script>
const layout=document.getElementById("layout");
const sidebar=document.querySelector(".sidebar");
const overlay=document.getElementById("overlay");

function isMobile(){
return window.innerWidth<768;
}

/* Desktop collapse restore */
if(!isMobile() && localStorage.getItem("sidebar")==="collapsed"){
layout.classList.add("sidebar-collapsed");
}

/* Mobile toggle */
document.getElementById("toggleSidebar").onclick=()=>{
sidebar.classList.toggle("open");
overlay.classList.toggle("show");
};

/* Desktop toggle */
document.getElementById("toggleSidebarDesktop").onclick=()=>{
layout.classList.toggle("sidebar-collapsed");
localStorage.setItem(
"sidebar",
layout.classList.contains("sidebar-collapsed")
?"collapsed":"expanded"
);
};

/* Overlay click close */
overlay.onclick=()=>{
sidebar.classList.remove("open");
overlay.classList.remove("show");
};

/* Auto close on mobile link click */
document.querySelectorAll(".sidebar a").forEach(link=>{
link.onclick=()=>{
if(isMobile()){
sidebar.classList.remove("open");
overlay.classList.remove("show");
}
};
});

/* Resize fix */
window.addEventListener("resize",()=>{
if(!isMobile()){
sidebar.classList.remove("open");
overlay.classList.remove("show");
}
});
</script>

</body>
    </html>
