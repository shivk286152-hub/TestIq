<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{% block title %}{{ site_name }}{% endblock %}</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
--header-h:4rem;
--sidebar-open:14rem;
--sidebar-close:4.5rem;
}

/* ===== HEADER ===== */
.header{
height:var(--header-h);
}

/* ===== SIDEBAR ===== */
.sidebar{
position:fixed;
top:var(--header-h);
left:0;
height:calc(100dvh - var(--header-h));
width:var(--sidebar-open);
background:#374151;
color:white;
display:flex;
flex-direction:column;
transition:.3s;
z-index:60;
}

/* collapsed desktop */
.sidebar.collapsed{
width:var(--sidebar-close);
}

.sidebar.collapsed .label{
display:none;
}

/* sidebar content */
.sidebar-content{
flex:1;
overflow-y:auto;
}

/* bottom auth */
.sidebar-bottom{
border-top:1px solid #4b5563;
}

/* ===== MAIN ===== */
.main{
margin-left:var(--sidebar-open);
padding-top:calc(var(--header-h) + 1rem);
min-height:100dvh;
transition:.3s;
}

.main.collapsed{
margin-left:var(--sidebar-close);
}

/* ===== MOBILE ===== */
@media(max-width:768px){

.sidebar{
transform:translateX(-100%);
width:14rem;
}

.sidebar.open{
transform:translateX(0);
}

.main,
.main.collapsed{
margin-left:0;
}

.overlay{
position:fixed;
inset:0;
top:var(--header-h);
background:rgba(0,0,0,.4);
display:none;
z-index:50;
}

.overlay.show{
display:block;
}
}
</style>
</head>

<body class="bg-gray-100">

<!-- ===== HEADER ===== -->
<header class="header fixed top-0 left-0 right-0 bg-white shadow z-50">

<div class="h-full px-4 flex justify-between items-center">

<div class="flex items-center gap-3">

<button id="menuBtn" class="md:hidden text-xl">
<i class="fa fa-bars"></i>
</button>

<button id="collapseBtn" class="hidden md:block text-xl">
<i class="fa fa-bars"></i>
</button>

<span class="text-lg font-bold text-blue-600">
{{ site_name }}
</span>

</div>

{% if user.is_authenticated %}
<div class="flex items-center gap-2">
<i class="fa fa-user-circle text-2xl"></i>
<span>{{ user.username }}</span>
</div>
{% endif %}

</div>
</header>

<!-- ===== SIDEBAR ===== -->
<aside id="sidebar" class="sidebar">

<!-- TOP MENU -->
<div class="sidebar-content py-4 space-y-1">

<a href="#" class="flex items-center px-4 py-3 hover:bg-gray-600">
<i class="fa fa-pen w-6"></i>
<span class="label ml-3">Test</span>
</a>

<a href="#" class="flex items-center px-4 py-3 hover:bg-gray-600">
<i class="fa fa-newspaper w-6"></i>
<span class="label ml-3">Current Affairs</span>
</a>

<a href="#" class="flex items-center px-4 py-3 hover:bg-gray-600">
<i class="fa fa-book w-6"></i>
<span class="label ml-3">Exam News</span>
</a>

</div>

<!-- BOTTOM LOGIN -->
<div class="sidebar-bottom py-3">

{% if user.is_authenticated %}

<a href="{% url 'profile' %}"
class="flex items-center px-4 py-3 hover:bg-gray-600">
<i class="fa fa-user w-6"></i>
<span class="label ml-3">{{ user.username }}</span>
</a>

<a href="{% url 'logout' %}"
class="flex items-center px-4 py-3 hover:bg-gray-600 text-red-300">
<i class="fa fa-sign-out w-6"></i>
<span class="label ml-3">Logout</span>
</a>

{% else %}

<a href="{% url 'login' %}"
class="flex items-center px-4 py-3 hover:bg-gray-600">
<i class="fa fa-sign-in w-6"></i>
<span class="label ml-3">Login</span>
</a>

{% endif %}

</div>

</aside>

<div id="overlay" class="overlay"></div>

<!-- ===== MAIN ===== -->
<main id="main" class="main px-4">
{% block content %}{% endblock %}
</main>

<!-- ===== JS ===== -->
<script>
const sidebar=document.getElementById("sidebar");
const main=document.getElementById("main");
const overlay=document.getElementById("overlay");

/* mobile open */
menuBtn.onclick=()=>{
sidebar.classList.toggle("open");
overlay.classList.toggle("show");
};

/* desktop collapse */
collapseBtn.onclick=()=>{
sidebar.classList.toggle("collapsed");
main.classList.toggle("collapsed");
};

/* close mobile */
overlay.onclick=()=>{
sidebar.classList.remove("open");
overlay.classList.remove("show");
};
</script>

</body>
  </html>
