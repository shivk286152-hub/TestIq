<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}{{ site_name }}{% endblock %}</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root { --sidebar-width: 13rem; }

html,body{height:100%;margin:0;}

/* Desktop */
@media (min-width:768px){
.sidebar{
width:var(--sidebar-width);
transform:translateX(0)!important;
position:relative!important;
height:calc(100vh - 4rem);
}
.main{
margin-left:var(--sidebar-width);
min-height:calc(100vh - 4rem);
}
.overlay{display:none!important;}
}

/* Mobile */
@media (max-width:767px){
.sidebar{
width:11rem;
transform:translateX(-100%);
position:fixed;
z-index:60;
height:calc(100vh - 4rem); /* FULL MOBILE HEIGHT */
top:4rem; left:0;
background:#374151;
}
.sidebar.open{transform:translateX(0);}
.main{
margin:0!important;
width:100%;
padding:1rem;
min-height:calc(100vh - 4rem);
}
.overlay{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.4);
z-index:50;
top:4rem;
}
.overlay.show{display:block;}
}
</style>
</head>

<body class="bg-gray-100 text-gray-800">

<!-- HEADER (UNCHANGED STYLE) -->
<header class="fixed top-0 left-0 right-0 h-16 bg-white shadow z-50">

<div class="h-full px-4 flex items-center justify-between">

<div class="flex items-center gap-3">
<button id="toggleSidebar" class="text-xl md:hidden">
<i class="fa-solid fa-bars"></i>
</button>

<span class="text-lg font-bold text-blue-600">
{{ site_name }}
</span>
</div>

{% if user.is_authenticated %}
<div class="flex items-center gap-2">
<i class="fa fa-user-circle text-2xl"></i>
<span class="text-sm">{{ user.username }}</span>
</div>
{% endif %}

</div>
</header>

<!-- LAYOUT -->
<div id="layout" class="flex pt-16">

<!-- SIDEBAR -->
<aside class="sidebar text-white transition-all duration-300 flex flex-col">

<nav class="flex-1 py-4 space-y-1">

<a href="#" class="flex items-center px-4 py-3 hover:bg-gray-600">
<i class="fa fa-pen w-6"></i>
<span class="ml-3">Test</span>
</a>

<a href="#" class="flex items-center px-4 py-3 hover:bg-gray-600">
<i class="fa fa-newspaper w-6"></i>
<span class="ml-3">Current Affairs</span>
</a>

<a href="#" class="flex items-center px-4 py-3 hover:bg-gray-600">
<i class="fa fa-book w-6"></i>
<span class="ml-3">Exam News</span>
</a>

<!-- LOGIN SECTION -->
{% if user.is_authenticated %}
<a href="{% url 'profile' %}" class="flex items-center px-4 py-3 hover:bg-gray-600">
<i class="fa fa-user w-6"></i>
<span class="ml-3">{{ user.username }}</span>
</a>

<a href="{% url 'logout' %}" class="flex items-center px-4 py-3 hover:bg-gray-600 text-red-300">
<i class="fa fa-sign-out w-6"></i>
<span class="ml-3">Logout</span>
</a>

{% else %}
<a href="{% url 'login' %}" class="flex items-center px-4 py-3 hover:bg-gray-600">
<i class="fa fa-sign-in w-6"></i>
<span class="ml-3">Login</span>
</a>

<a href="{% url 'register' %}" class="flex items-center px-4 py-3 hover:bg-gray-600">
<i class="fa fa-user-plus w-6"></i>
<span class="ml-3">Register</span>
</a>
{% endif %}

</nav>
</aside>

<div id="overlay" class="overlay"></div>

<main class="main flex-1 overflow-y-auto">
{% block content %}{% endblock %}
</main>

</div>

<!-- JS -->
<script>
const sidebar=document.querySelector(".sidebar");
const overlay=document.getElementById("overlay");

document.getElementById("toggleSidebar").onclick=()=>{
sidebar.classList.toggle("open");
overlay.classList.toggle("show");
};

overlay.onclick=()=>{
sidebar.classList.remove("open");
overlay.classList.remove("show");
};

window.addEventListener("resize",()=>{
if(window.innerWidth>=768){
sidebar.classList.remove("open");
overlay.classList.remove("show");
}
});
</script>

{% block scripts %}{% endblock %}
</body>
        </html>
