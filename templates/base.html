<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{% block title %}My Site{% endblock %}</title>

<!-- Tailwind CDN -->
<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100 flex min-h-screen">

<!-- ===== SIDEBAR (Desktop) ===== -->
<div class="hidden md:block w-64 bg-gray-900 text-white min-h-screen p-5">

    <h2 class="text-xl font-bold mb-6">Menu</h2>

    <a href="/" class="block py-2 hover:text-blue-400">Home</a>
    <a href="/mock-tests/" class="block py-2 hover:text-blue-400">Mock Tests</a>
    <a href="/results/" class="block py-2 hover:text-blue-400">Results</a>
    <a href="/profile/" class="block py-2 hover:text-blue-400">Profile</a>

</div>

<!-- ===== CONTENT ===== -->
<div class="flex-1 p-4 pb-24 overflow-y-auto">

    {% block content %}
    {% endblock %}

</div>

<!-- ===== MOBILE GLASS NAVBAR ===== -->
<div id="mobileNav"
class="md:hidden fixed bottom-4 left-1/2 -translate-x-1/2 w-[95%]
h-16 flex justify-around items-center
rounded-2xl
bg-white/20 backdrop-blur-lg
border border-white/30
shadow-lg
transition-all duration-300">

    <a href="/" class="flex flex-col items-center text-gray-800 active:scale-110 transition">
        <span class="text-xl">🏠</span>
        <span class="text-xs">Home</span>
    </a>

    <a href="/mock-tests/" class="flex flex-col items-center text-gray-800 active:scale-110 transition">
        <span class="text-xl">📝</span>
        <span class="text-xs">Tests</span>
    </a>

    <a href="/results/" class="flex flex-col items-center text-gray-800 active:scale-110 transition">
        <span class="text-xl">📊</span>
        <span class="text-xs">Results</span>
    </a>

    <a href="/profile/" class="flex flex-col items-center text-gray-800 active:scale-110 transition">
        <span class="text-xl">👤</span>
        <span class="text-xs">Profile</span>
    </a>

</div>

<!-- ===== JS Scroll Hide/Show ===== -->
<script>

let navbar = document.getElementById("mobileNav");
let timer;

window.addEventListener("scroll", () => {

    navbar.style.transform = "translate(-50%,120px)";
    navbar.style.opacity = "0";

    clearTimeout(timer);

    timer = setTimeout(()=>{
        navbar.style.transform = "translate(-50%,0)";
        navbar.style.opacity = "1";
    }, 250);

});

</script>

</body>
</html>
