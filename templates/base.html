<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ site_name }}{% endblock %}</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        :root {
            --sidebar-width: 13rem;
        }

        .sidebar-collapsed {
            --sidebar-width: 4rem;
        }

        .sidebar-text {
            transition: opacity 0.25s ease, transform 0.25s ease;
            white-space: nowrap;
        }

        .sidebar-collapsed .sidebar-text {
            opacity: 0;
            transform: translateX(-10px);
            pointer-events: none;
        }

        /* DESKTOP */
        @media (min-width: 768px) {
            .sidebar {
                width: var(--sidebar-width);
                transform: translateX(0) !important;
                position: relative !important;
                z-index: auto !important;
                height: calc(100vh - 3.5rem) !important;
            }

            .main {
                margin-left: var(--sidebar-width);
                margin-right: 0;
            }

            .overlay {
                display: none !important;
            }

            body {
                overflow: auto;
            }
        }

        /* MOBILE */
        @media (max-width: 767px) {
            .sidebar {
                width: 14rem;
                transform: translateX(-100%);
                position: fixed;
                z-index: 60;
                height: calc(100vh - 3.5rem);
                top: 3.5rem;
                left: 0;
                right: auto;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main {
                margin-left: 0 !important;
                margin-right: 0;
                width: 100%;
            }

            .overlay {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.5);
                z-index: 50;
                top: 3.5rem;
            }

            .overlay.show {
                display: block;
            }

            body {
                overflow-x: hidden;
            }

            header {
                width: 100%;
            }
        }

        /* Ensure proper layout structure */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        #layout {
            position: relative;
        }
    </style>

</head>

<body class="bg-gray-100 text-gray-800">

    <!-- HEADER -->
    <header class="fixed top-0 left-0 right-0 h-16 bg-white shadow z-50">
        <div class="h-full px-4 flex items-center justify-between">

            <!-- LEFT -->
            <div class="flex items-center gap-3">
                <button id="toggleSidebar" class="text-gray-700 hover:text-blue-600 text-xl md:hidden lg:hidden">
                    <i class="fa-solid fa-bars"></i>
                </button>

                <button id="toggleSidebarDesktop" class="text-gray-700 hover:text-blue-600 text-xl hidden md:block">
                    <i class="fa-solid fa-bars"></i>
                </button>

                <span class="text-lg font-bold text-blue-600 whitespace-nowrap">
                    {{ site_name }}
                </span>
            </div>

            <!-- RIGHT -->
            <div class="flex items-center gap-3 md:gap-5">

                <!-- SEARCH -->
                <div class="hidden md:flex items-center bg-gray-100 rounded px-3 py-1">
                    <i class="fa-solid fa-magnifying-glass text-gray-500 text-sm"></i>
                    <input type="text" placeholder="Search..." class="bg-transparent outline-none px-2 text-sm w-40">
                </div>

                <!-- USER DROPDOWN -->
                {% if user.is_authenticated %}
                <div class="relative group">

                    <button class="flex items-center gap-2 focus:outline-none">
                        {% if user.profile.profile_pic %}
                        <img src="{{ user.profile.profile_pic.url }}" class="w-8 h-8 md:w-9 md:h-9 rounded-full object-cover border">
                        {% else %}
                        <i class="fa-solid fa-user-circle text-2xl md:text-3xl text-gray-600"></i>
                        {% endif %}

                        <span class="hidden sm:block text-sm font-medium text-gray-700">
                            {{ user.username }}
                        </span>
                    </button>

                    <div class="absolute right-0 mt-2 w-40 md:w-44 bg-white rounded shadow-lg
                               opacity-0 invisible group-hover:opacity-100
                               group-hover:visible transition-all duration-200 z-50">

                        <a href="{% url 'profile' %}" class="block px-4 py-2 text-sm hover:bg-gray-100">
                            <i class="fa-solid fa-user mr-2"></i> Profile
                        </a>

                        <a href="{% url 'logout' %}" class="block px-4 py-2 text-sm hover:bg-gray-100 text-red-600">
                            <i class="fa-solid fa-right-from-bracket mr-2"></i> Logout
                        </a>
                    </div>

                </div>
                {% else %}
                <a href="{% url 'login' %}" class="text-blue-600 font-medium text-sm md:text-base">
                    Login
                </a>
                {% endif %}
            </div>

        </div>
    </header>

    <!-- BODY -->
    <div id="layout" class="flex pt-16 transition-[--sidebar-width] duration-300 ease-in-out">

        <!-- SIDEBAR -->
        <aside class="sidebar bg-gray-700 text-white transition-all duration-300 ease-in-out flex flex-col overflow-y-auto">

            <nav class="flex-1 py-4 space-y-1">

                <a href="#" class="flex items-center px-4 py-3 hover:bg-gray-600 transition-colors">
                    <div class="w-6 md:w-8 flex-shrink-0 text-center">
                        <i class="fa-solid fa-pen"></i>
                    </div>
                    <span class="sidebar-text ml-3">Test</span>
                </a>

                <a href="#" class="flex items-center px-4 py-3 hover:bg-gray-600 transition-colors">
                    <div class="w-6 md:w-8 flex-shrink-0 text-center">
                        <i class="fa-solid fa-newspaper"></i>
                    </div>
                    <span class="sidebar-text ml-3">Current Affairs</span>
                </a>

                <a href="#" class="flex items-center px-4 py-3 hover:bg-gray-600 transition-colors">
                    <div class="w-6 md:w-8 flex-shrink-0 text-center">
                        <i class="fa-solid fa-book"></i>
                    </div>
                    <span class="sidebar-text ml-3">Exam News</span>
                </a>
            </nav>

            <!-- SIDEBAR BOTTOM -->
            <div class="border-t border-gray-600 p-3 md:p-4 mt-auto">
                {% if user.is_authenticated %}
                <a href="{% url 'profile' %}" class="flex items-center hover:text-blue-300 transition-colors">
                    <div class="w-6 md:w-8 flex-shrink-0 text-center">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <span class="sidebar-text ml-3">
                        {{ user.username }}
                    </span>
                </a>
                {% else %}
                <a href="{% url 'login' %}" class="flex items-center text-blue-300 hover:text-blue-100 transition-colors">
                    <div class="w-6 md:w-8 flex-shrink-0 text-center">
                        <i class="fa-solid fa-right-to-bracket"></i>
                    </div>
                    <span class="sidebar-text ml-3">Login</span>
                </a>
                {% endif %}
            </div>
        </aside>

        <!-- OVERLAY (for mobile only) -->
        <div id="overlay" class="overlay"></div>

        <!-- MAIN -->
        <main class="main flex-1 px-3 md:px-6 py-4 md:py-6 overflow-y-auto transition-all duration-300 ease-in-out">
            {% block content %}{% endblock %}
        </main>

    </div>

    <!-- JS -->
    <script>
        const layout = document.getElementById("layout");
        const toggleBtn = document.getElementById("toggleSidebar");
        const toggleBtnDesktop = document.getElementById("toggleSidebarDesktop");
        const sidebar = document.querySelector(".sidebar");
        const overlay = document.getElementById("overlay");

        function isMobile() {
            return window.innerWidth < 768;
        }

        // Desktop collapse system
        if (!isMobile() && localStorage.getItem("sidebar") === "collapsed") {
            layout.classList.add("sidebar-collapsed");
        }

        // Mobile toggle
        if (toggleBtn) {
            toggleBtn.onclick = () => {
                sidebar.classList.toggle("open");
                overlay.classList.toggle("show");
            };
        }

        // Desktop toggle
        if (toggleBtnDesktop) {
            toggleBtnDesktop.onclick = () => {
                layout.classList.toggle("sidebar-collapsed");
                localStorage.setItem(
                    "sidebar",
                    layout.classList.contains("sidebar-collapsed") ? "collapsed" : "expanded"
                );
            };
        }

        // Close sidebar on overlay click
        overlay.onclick = () => {
            sidebar.classList.remove("open");
            overlay.classList.remove("show");
        };

        // Close sidebar when clicking on a link (mobile)
        if (isMobile()) {
            document.querySelectorAll(".sidebar a").forEach(link => {
                link.onclick = () => {
                    sidebar.classList.remove("open");
                    overlay.classList.remove("show");
                };
            });
        }

        // Handle window resize
        window.addEventListener("resize", () => {
            if (!isMobile()) {
                sidebar.classList.remove("open");
                overlay.classList.remove("show");
            }
        });
    </script>

</body>

</html>
