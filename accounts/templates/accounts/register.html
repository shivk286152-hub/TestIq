{% extends "base.html" %}
{% load static %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="relative min-h-screen flex items-center justify-center bg-gray-100">

<div class="bg-white w-full max-w-md rounded-xl shadow-xl p-8">

    <!-- ICON -->
    <div class="text-center mb-4">
        <div class="text-blue-600 text-4xl">👤</div>
    </div>

    <!-- TITLE -->
    <h2 class="text-2xl font-bold text-center">
        Create account!
    </h2>

    <!-- FORM -->
    <form method="POST" class="mt-6 space-y-5">
        {% csrf_token %}

        <!-- Name -->
        <div class="relative">
            <input type="text" name="username" placeholder="Name"
            class="w-full border-b py-3 focus:outline-none focus:border-blue-600">
        </div>

        <!-- Email -->
        <div class="relative">
            <input type="email" name="email" placeholder="E-mail"
            class="w-full border-b py-3 focus:outline-none focus:border-blue-600">
        </div>

        <!-- Password -->
        <div class="relative">
            <input type="password" name="password" placeholder="Password"
            class="w-full border-b py-3 focus:outline-none focus:border-blue-600">
        </div>

        <!-- Button -->
        <button type="submit"
        class="w-2/3 mx-auto block bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-md font-medium transition">
            Create →
        </button>
    </form>

    <!-- Thin Line -->
    <div class="border-t mt-8 mb-4"></div>

    <!-- Social Text -->
    <p class="text-center text-gray-500 text-sm mb-4">
        Create account using social media!
    </p>

    <!-- Google Label -->
    <p class="text-center text-sm text-gray-400 mb-3">
        Register / Sign-up with Google
    </p>

    <!-- GOOGLE BUTTON -->
    <div class="relative group w-full">

        <!-- Animated Border -->
        <div class="absolute inset-0 rounded-md
        bg-gradient-to-r from-red-500 via-yellow-500 to-green-500
        opacity-0 group-hover:opacity-100
        group-active:opacity-100
        transition duration-700 animate-border"></div>

        <!-- Inner Box -->
        <a href="#"
        class="relative flex justify-center items-center
        border rounded-md py-3 bg-white
        group-hover:bg-red-500 group-active:bg-red-500
        transition duration-700">

            <!-- Google Icon -->
            <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg"
            class="w-6 h-6">
        </a>
    </div>

    <!-- Messages -->
    {% for message in messages %}
        <p class="text-red-500 text-center mt-4">{{ message }}</p>
    {% endfor %}

</div>
</div>

<!-- Animation Style -->
<style>
@keyframes borderRun {
    0% {clip-path: inset(0 100% 0 0);}
    100% {clip-path: inset(0 0 0 0);}
}
.animate-border{
    animation: borderRun 0.8s linear forwards;
}
</style>

{% endblock %}
